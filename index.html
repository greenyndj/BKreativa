<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BKreativa · Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ef; --card:#fff; --ink:#1e1b24; --muted:#6e6878; --line:#e9e3da; --soft:#f1ece4;
  --c:#00a3d4; --m:#d6177a; --y:#f5b800; --g:#1f9d61; --r:#d93a3a; --v:#7a4fd6;
  --pri:#d6177a; --pri-ink:#fff; --radius:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#1e1b24;color:#fff;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.brand{display:none}
.nav button{background:none;border:0;color:#b9b3c4;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 8px;border-radius:10px;cursor:pointer;flex:1}
.nav button svg{width:22px;height:22px}
.nav button.on{color:#fff}
.nav button.on svg{color:var(--y)}
main{flex:1;min-width:0;padding:0 14px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 10px;flex-wrap:wrap}
.top h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.02em}
.top .biz{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.mini-logo{height:30px;width:auto}
/* hero de bienvenida */
.hero{position:relative;background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;overflow:hidden;border:1px solid var(--line)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#00a3e0,#7b3fe4,#e6007e,#ff7a00,#ffd000)}
.hero-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero-top img{height:64px;width:auto}
.hero h2{font-size:21px;margin:0}
.hero .date{color:var(--muted);font-size:13.5px}
.hero .date::first-letter{text-transform:uppercase}
@media(max-width:600px){.hero{padding:14px}.hero-top img{display:none}.hero h2{font-size:18px}.today{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.today button{padding:6px 8px;font-size:11.5px;line-height:1.2}.today button b{font-size:17px}.tip{flex-wrap:wrap}.tip button{margin-left:28px}}
.today{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.today button{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;font-size:13px;color:var(--muted)}
.today button b{display:block;font-size:19px;color:var(--ink)}
.today button.alert b{color:var(--r)}
.tip{display:flex;gap:10px;align-items:flex-start;background:#fff8e1;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.tip .bulb{font-size:18px;line-height:1.1}
.tip button{margin-left:auto;flex:none}
.socials{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.soc{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:13.5px;font-weight:600;text-decoration:none;color:#fff}
.soc svg{width:15px;height:15px}
.soc.wa{background:#1fa855}.soc.ig{background:linear-gradient(45deg,#f9a825,#e6007e,#7b3fe4)}.soc.tt{background:#111}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.steps button{border:1px dashed #d9cfe9;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.steps button.done{border-style:solid;border-color:#bfe6d1;background:#ecf8f1;color:#13703f;text-decoration:line-through}
.tag-ref{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#efe8fc;color:#5b33b4;margin-right:4px}
.ship{font-size:13px;margin-top:6px;background:#eef8fd;border-radius:8px;padding:6px 9px}
.costline{font-size:12px;color:var(--muted)}
.cost-pick{grid-column:1/-1;background:#fdf6e9;border:1px solid #f1e3c2;border-radius:10px;padding:8px 10px;display:grid;gap:6px}
.cost-pick .g2c{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.alerta{background:#fff1f1;border:1px solid #f3c3c3;border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.alerta-h{font-size:14.5px;margin-bottom:4px}
.ok-box{background:#ecf8f1;border:1px solid #bfe6d1;color:#13703f;border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-weight:500}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .r{text-align:right;white-space:nowrap}
.tbl .s{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mrow{display:grid;grid-template-columns:36px 1fr 96px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.mrow span:last-child{text-align:right;font-weight:600}
.mb{height:8px;border-radius:999px;margin:2px 0;min-width:2px}
@media(max-width:899px){.nav button{padding:6px 2px;font-size:10.5px}}
@media(min-width:900px){
  .nav{position:sticky;top:0;bottom:auto;height:100vh;width:220px;flex-direction:column;justify-content:flex-start;padding:22px 14px;gap:4px}
  .brand{display:block;padding:0 8px 22px}
  .brand .logo-box{background:#fff;border-radius:14px;padding:10px 12px}
  .brand .logo-box img{width:100%;display:block}
  .brand small{color:#9a93a6;display:block;margin-top:10px;text-align:center}
  .top .mini-logo{display:none}
  .nav button{flex:none;flex-direction:row;font-size:15px;gap:12px;padding:10px 12px;justify-content:flex-start}
  .nav button.on{background:#2e2a37}
  main{padding:0 32px 40px}
  .top{padding:26px 0 16px}
  .top h1{font-size:30px}
}
/* UI */
.btn{border:0;background:var(--pri);color:var(--pri-ink);padding:10px 16px;border-radius:999px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--ink);color:#fff}
.btn.wa{background:#1fa855;color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon{border:1px solid var(--line);background:var(--card);border-radius:10px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--muted)}
.icon:hover{color:var(--r);border-color:#f0c9c9}
.icon svg{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.grid{display:grid;gap:12px}
.cards{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:relative;overflow:hidden}
.kpi small{color:var(--muted);font-size:12.5px;display:block}
.kpi b{font-size:22px;display:block;margin-top:4px;letter-spacing:-.02em}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--c))}
.two{display:grid;gap:14px}
@media(min-width:1000px){.two{grid-template-columns:1.3fr 1fr}}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip span{color:var(--muted);margin-left:2px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on span{color:#cfc9d9}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=month],input[type=tel],select,textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--c);box-shadow:0 0 0 3px #00a3d422}
.toolbar input[type=search]{flex:1;min-width:180px}
.toolbar input[type=month]{width:auto}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.e-nuevo{background:#e0f5fc;color:#00789c}
.e-diseno{background:#efe8fc;color:#5b33b4}
.e-produccion{background:#fff3cf;color:#8a6500}
.e-listo{background:#dcf4e8;color:#13703f}
.e-entregado{background:#ece9ef;color:#5c5666}
.e-cancelado{background:#fbe2e2;color:#a92525}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.num{font-size:12px;color:var(--muted);font-weight:600}
.cli{font-weight:600;font-size:16.5px}
.its{list-style:none;padding:0;margin:10px 0;font-size:14px}
.its li{padding:2px 0}
.meta{font-size:13px;color:var(--muted)}
.late{color:var(--r);font-weight:600}
.soon{color:#b07c00;font-weight:600}
.notas{font-size:13px;background:var(--soft);border-radius:8px;padding:6px 9px;margin-top:8px}
.money3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0;background:var(--soft);border-radius:10px;padding:8px 10px;font-weight:600}
.money3 small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.money3 .due{color:var(--m)}
.card-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-a select{width:auto;flex:1;min-width:130px;padding:6px 9px;font-size:13px}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
@media(max-width:600px){.list .li{flex-wrap:wrap}.list .li>div:last-child{margin-left:auto}}
.li .t{font-weight:500}
.li .s{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);grid-column:1/-1}
.empty p{margin:0 0 12px}
/* inventario */
.inv{display:grid;gap:8px}
.inv-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.inv-row.low{border-color:#f3c3c3;background:#fff8f8}
.inv-row .n{font-weight:600}
.inv-row .c{font-size:12.5px;color:var(--muted)}
.stockbox{display:flex;align-items:center;gap:6px}
.stockbox b{min-width:58px;text-align:center;font-size:17px}
.stockbox b small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.step{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;line-height:1}
.inv-row .acts{grid-column:1/-1;display:flex;gap:6px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.pill-low{font-size:11.5px;background:var(--r);color:#fff;border-radius:999px;padding:2px 8px;margin-left:6px;font-weight:600}
/* catálogo */
.cat{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
@media(min-width:700px){.cat{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.prod{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.prod .ph{aspect-ratio:1/1;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.prod .ph img{width:100%;height:100%;object-fit:cover}
.prod .ph .ini{font-size:40px;font-weight:700;color:#fff;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.prod .ph .tag{position:absolute;top:8px;left:8px;background:#fffd;border-radius:999px;font-size:11px;padding:3px 8px;font-weight:600}
.prod .ph .off{position:absolute;top:8px;right:8px;background:#1e1b24cc;color:#fff;border-radius:999px;font-size:11px;padding:3px 8px}
.prod .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.prod .pn{font-weight:600;line-height:1.25}
.prod .pp{font-size:18px;font-weight:700;color:var(--m)}
.prod .pd{font-size:12.5px;color:var(--muted)}
.prod .pa{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.prod .pa .btn{flex:1;justify-content:center}
.vitrina .prod .pn{font-size:16px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--m)}
/* bars */
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.bar .tr{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--c);border-radius:999px}
/* modal */
.modal{position:fixed;inset:0;background:#1e1b2499;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px;padding:24px}}
.sheet h3{margin:0 0 14px;font-size:20px}
.f{display:grid;gap:12px}
.f label{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.f .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.f fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;background:var(--card)}
.f legend{font-size:13px;font-weight:600;padding:0 6px}
.item-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line);position:relative}
.item-row:last-child{border-bottom:0}
.item-row .full{grid-column:1/-1}
.item-row .cp{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;grid-column:1/-1;align-items:end}
.mini{font-size:11.5px!important}
.hint{font-size:11.5px;color:var(--muted);font-weight:400}
.inv-pick{grid-column:1/-1;background:#f5f1fb;border:1px solid #e6dcf5;border-radius:10px;padding:8px 10px;display:grid;gap:6px}
.inv-pick .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.inv-pick .g2{display:grid;grid-template-columns:1fr 1.6fr;gap:6px}
.mini input,.mini select{padding:7px 9px}
.total-line{display:flex;justify-content:flex-end;gap:16px;font-size:15px;margin-top:8px;flex-wrap:wrap}
.total-line b{font-size:17px}
.f-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;position:sticky;bottom:-20px;background:var(--bg);padding:10px 0}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .pv{width:84px;height:84px;border-radius:12px;background:var(--soft);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}
.photo-pick .pv img{width:100%;height:100%;object-fit:cover}
.chk{display:flex!important;grid-template-columns:none!important;align-items:center;gap:8px;color:var(--ink)!important;font-size:14px!important}
.chk input{width:18px;height:18px;accent-color:var(--m)}
.movs{font-size:12.5px;color:var(--muted);margin:0;padding-left:16px}
#banner:not(:empty){background:#fff3cf;color:#6d5000;border:1px solid #f1dd9c;border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:900px){#toast{bottom:30px}}
.skel{height:90px;border-radius:var(--radius);background:linear-gradient(90deg,#eee8df,#f6f2ec,#eee8df);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.copybox{width:100%;min-height:220px;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <nav class="nav">
    <div class="brand"><div class="logo-box"><img class="logo-img" alt="BKreativa"></div><b id="brandName" hidden>BKreativa</b><small>Sublimación y estampados</small></div>
    <button data-nav="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-nav="pedidos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Pedidos</button>
    <button data-nav="ventas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Ventas</button>
    <button data-nav="inventario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg>Inventario</button>
    <button data-nav="cuentas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Cuentas</button>
  </nav>
  <main>
    <header class="top">
      <div>
        <div class="biz"><img class="logo-img mini-logo" alt=""><span id="bizName" hidden>BKreativa</span><a href="#" data-act="ajustes" style="color:inherit">Ajustes</a></div>
        <h1 id="viewTitle">Inicio</h1>
      </div>
      <div class="top-actions" id="topActions"></div>
    </header>
    <div id="banner"></div>
    <section id="view"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ---------- constantes y utilidades ---------- */

const LS_KEY='tallerSublimacion_v1';
function normDoc(c,o){ if(c==='pedidos'&&o.estado==='Cancelado') o.estado='Anulado'; return o; }
function lsLoad(){ try{ const d=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(d){ COLS.forEach(c=>{ if(Array.isArray(d[c])) S[c]=d[c].map(o=>normDoc(c,o)); }); if(d.config && d.config.nombre && d.config.nombre!=='Mi Taller') S.config={...S.config,...d.config}; return true; } }catch(e){} return false; }
function lsSave(){ if(mode!=='local') return; try{ const d={config:S.config}; COLS.forEach(c=>d[c]=S[c].map(x=>{ const o={...x}; delete o._pend; delete o._t; return o; })); localStorage.setItem(LS_KEY,JSON.stringify(d)); return true; }catch(e){ return false; } }
async function put(col, id, data){
  if(mode==='db'){ await db.collection(col).doc(id).set(data); }
  else { if(col==='config'){ S.config={...S.config,...data}; } else { const a=S[col], i=a.findIndex(x=>x.id===id), o={...data,id}; i>=0?a[i]=o:a.push(o); } render(); }
}
async function patch(col, id, data){
  if(mode==='db'){ await db.collection(col).doc(id).update(data); }
  else { const o=S[col].find(x=>x.id===id); if(o) Object.assign(o,data); render(); }
}
async function del(col, id){
  if(mode==='db'){ await db.collection(col).doc(id).delete(); }
  else { S[col]=S[col].filter(x=>x.id!==id); render(); }
}
function clean(o){ const r={...o}; delete r.id; return r; }
async function guard(fn, okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){ console.error(e); toast(e && e.code==='quota_exceeded' ? 'Se llenó el espacio de la base de datos. Borra registros antiguos.' : e && e.code==='invalid_argument' ? 'No tienes permiso para guardar cambios aquí.' : 'No se pudo guardar. Intenta de nuevo.'); return false; }
}

/* descuenta (signo -1) o devuelve (+1) insumos según los consumos de cada producto */
function calcConsumo(items){
  const delta={};
  (items||[]).forEach(it=>{
    if(it.empaqueId && it.empaque && it.empaque!=='Sin empaque') delta[it.empaqueId]=(delta[it.empaqueId]||0)+num(it.cantidad);
    if(it.insumoId==='none'||it.invTipo==='none') return;
    if(it.invTipo==='cam'||it.invTipo==='pers'||(it.insumoId&&!it.invTipo)){ if(it.insumoId) delta[it.insumoId]=(delta[it.insumoId]||0)+num(it.cantidad); return; }
    const p=S.productos.find(x=>x.id===it.productoId); if(!p) return;
    (p.consumos||[]).forEach(c=>{ if(!c.insumoId) return; delta[c.insumoId]=(delta[c.insumoId]||0)+num(c.cantidad)*num(it.cantidad); }); });
  return delta;
}
/* aplica la diferencia entre lo que se debe tener descontado (nuevo) y lo ya descontado (viejo) */
async function aplicarDelta(nuevo, viejo, nota){
  nuevo=nuevo||{}; viejo=viejo||{}; const neg=[];
  for(const id of new Set([...Object.keys(nuevo),...Object.keys(viejo)])){
    const d=num(nuevo[id])-num(viejo[id]); if(!d) continue;
    const ins=S.insumos.find(x=>x.id===id); if(!ins) continue;
    const stock=num(ins.stock)-d; if(stock<0) neg.push(ins.nombre);
    const movs=[{f:today(), t:d>0?'Salida':'Entrada', c:Math.abs(d), n:nota}, ...(ins.movs||[])].slice(0,30);
    await patch('insumos', id, {stock, movs});
  }
  if(neg.length) setTimeout(()=>toast('⚠️ Sin stock suficiente: '+neg.join(', ')),2500);
  return neg;
}
async function moverInventario(items, signo, nota){
  const d=calcConsumo(items); return signo<0 ? aplicarDelta(d,{},nota) : aplicarDelta({},d,nota);
}
function costoProducto(p){
  if(num(p.costo)) return num(p.costo);
  return (p.consumos||[]).reduce((a,c)=>{ const i=S.insumos.find(x=>x.id===c.insumoId); return a+(i?costoTotalIns(i)*num(c.cantidad):0); },0);
}
function disponibles(p){
  const cs=(p.consumos||[]).filter(c=>c.insumoId&&num(c.cantidad)>0); if(!cs.length) return null;
  let min=Infinity; cs.forEach(c=>{ const i=S.insumos.find(x=>x.id===c.insumoId); min=Math.min(min, i?Math.floor(num(i.stock)/num(c.cantidad)):0); });
  return Math.max(0,min);
}

function render(){
  if(mode==='local' && !lsSave() && !render._warned){ render._warned=true; setBanner('Este navegador no permite guardar datos: los cambios se perderán al cerrar.'); }
  const ae=document.activeElement, fid=(ae&&ae.id&&$('#view').contains(ae))?ae.id:null;
  let sel=null; try{ if(fid && ae.selectionStart!=null) sel=[ae.selectionStart,ae.selectionEnd]; }catch(e){}
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on', b.dataset.nav===view));
  $('#bizName').textContent = S.config.nombre||'Mi Taller';
  $('#brandName').textContent = S.config.nombre||'Mi Taller';
  $('#viewTitle').textContent = TITLES[view];
  $('#topActions').innerHTML = topActions();
  $('#view').innerHTML = mode==='loading' ? '<div class="grid cards"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>' : ({inicio:vInicio, pedidos:vPedidos, ventas:vVentas, inventario:vInventario, catalogo:vCatalogo, cuentas:vCuentas}[view])();

}

function vInicio(){

  const cancMes=pedidosValidos().filter(p=>faltaDe(p)<=0 && ym(fechaCancelado(p))===m);

  const sum=a=>a.reduce((s,v)=>s+num(v.total),0);
  const activos=S.pedidos.filter(p=>!CERRADOS.includes(p.estado));

  const prox=[...activos].sort((a,b)=>(a.fechaEntrega||'9999').localeCompare(b.fechaEntrega||'9999')).slice(0,6);

    <div class="kpi" style="--accent:var(--g)"><small>Ventas de ${MESES_L[+m.slice(5)-1]}</small><b>${money(sum(cancMes))}</b><em>${cancMes.length} pedido${cancMes.length===1?'':'s'} cancelado${cancMes.length===1?'':'s'}</em></div>

function pedidoCard(p){
  const saldo=faltaDe(p), abierto=p.estado!=='Anulado';
  let when='Sin fecha de entrega';
  if(p.fechaEntrega){ const d=daysUntil(p.fechaEntrega);

/* VENTAS = historial de pedidos con su estado de pago */
function pagosDe(p){
  if(Array.isArray(p.pagos)) return p.pagos;
  if(p.ventaId){ const v=S.ventas.find(x=>x.id===p.ventaId); return [{f:p.entregado||fechaPed(p), monto:num(p.total), metodo:v?.metodo||''}]; }
  return num(p.abono)?[{f:fechaPed(p), monto:num(p.abono), metodo:p.metodoAbono||''}]:[];
}
const fechaPed = p => (p.creado||'').slice(0,10) || today();
const pagadoDe = p => pagosDe(p).reduce((a,x)=>a+num(x.monto),0);
const faltaDe = p => Math.max(0, num(p.total)-pagadoDe(p));
const pedidosValidos = () => S.pedidos.filter(p=>p.estado!=='Anulado');
const ventasDirectas = () => S.ventas.filter(v=>!v.pedidoId);   // ventas antiguas registradas aparte
function recaudadoMes(m){
  return pedidosValidos().reduce((a,p)=>a+pagosDe(p).filter(x=>ym(x.f)===m).reduce((s,x)=>s+num(x.monto),0),0)
    + ventasDirectas().filter(v=>ym(v.fecha)===m).reduce((a,v)=>a+num(v.total),0);
}
function fechaCancelado(p){
  if(faltaDe(p)>0) return null;
  let acc=0; const L=[...pagosDe(p)].sort((a,b)=>(a.f||'').localeCompare(b.f||''));
  for(const x of L){ acc+=num(x.monto); if(acc>=num(p.total)) return x.f||fechaPed(p); }
  return fechaPed(p);
}
function costoItem(it){
  const x=S.insumos.find(y=>y.id===it.insumoId), p=S.productos.find(y=>y.id===it.productoId);
  const base = it.costoProd!=null ? num(it.costoProd) : (x?costoBase(x):(p?costoProducto(p):0));
  return base+num(it.costoPers)+num(it.costoEmpaque)+num(it.gastoInd);
}
function costoItems(items){ return (items||[]).reduce((s,it)=>s+costoItem(it)*num(it.cantidad),0); }
function pagoBadge(p){ const f=faltaDe(p); return f<=0 ? '<span class="badge e-listo">Cancelado ✓</span>' : `<span class="badge e-cancelado">Pendiente ${money(f)}</span>`; }
function vVentas(){
  const m=ui.ventasMes||ym(today()), pm=prevMonth(m), filtro=ui.ventasFiltro||'todos';
  const val=pedidosValidos();
  const cancDe=mm=>val.filter(p=>faltaDe(p)<=0 && ym(fechaCancelado(p))===mm);
  const canc=cancDe(m);
  const directas=ventasDirectas().filter(v=>ym(v.fecha)===m);
  const ventas=canc.reduce((a,p)=>a+num(p.total),0)+directas.reduce((a,v)=>a+num(v.total),0);
  const prev=cancDe(pm).reduce((a,p)=>a+num(p.total),0);
  const diff=prev?Math.round((ventas-prev)/prev*100):null;
  const pend=val.filter(p=>faltaDe(p)>0).sort((a,b)=>(a.creado||'').localeCompare(b.creado||''));
  const porCancelar=pend.reduce((a,p)=>a+faltaDe(p),0);
  const ganancia=canc.reduce((a,p)=>a+num(p.total)-costoItems(p.items),0);
  let list;
  if(filtro==='cancelados') list=canc;
  else if(filtro==='pendientes') list=pend;
  else { const ids=new Set(); list=[...val.filter(p=>ym(fechaPed(p))===m), ...canc].filter(p=>!ids.has(p.id)&&ids.add(p.id)); }
  list=[...list].sort((a,b)=>(b.creado||'').localeCompare(a.creado||''));
  const met={}; val.forEach(p=>pagosDe(p).filter(x=>ym(x.f)===m).forEach(x=>{ const k=x.metodo||'Sin especificar'; met[k]=(met[k]||0)+num(x.monto); }));
  const metE=Object.entries(met).sort((a,b)=>b[1]-a[1]), maxM=metE.length?metE[0][1]:1;
  const alerta = pend.length ? `<div class="alerta"><div class="alerta-h">⚠️ <b>${pend.length} pedido${pend.length>1?'s':''} sin cancelar en su totalidad</b> · pendiente por cobrar <b>${money(porCancelar)}</b></div>
    <div class="list">${pend.slice(0,5).map(p=>`<div class="li"><div><div class="t">#${p.num} · ${esc(p.cliente)}</div><div class="s">${fmtDate(fechaPed(p))} · ${esc(p.estado)} · total ${money(p.total)} · abonado ${money(pagadoDe(p))}</div></div><div style="display:flex;gap:8px;align-items:center;flex:none"><b class="late">Falta ${money(faltaDe(p))}</b><button class="btn sm" data-act="pagoNuevo" data-id="${p.id}">Registrar abono</button></div></div>`).join('')}</div>

    ${filtro!=='pendientes'?directas.map(v=>`<tr><td>—<div class="s">${fmtDate(v.fecha)}</div></td><td>${esc(v.cliente||'Venta directa')}<div class="s">${esc(itemsResumen(v.items))}</div></td><td>—</td><td class="r">${money(v.total)}</td><td class="r">${money(v.total)}</td><td class="r">—</td><td><span class="badge e-listo">Cancelado ✓</span></td></tr>`).join(''):''}

  return `<div class="toolbar"><input type="month" id="ventasMes" data-input="ui" data-k="ventasMes" value="${m}"><span class="muted">${monthName(m)}</span></div>
  <div class="kpis">

    <div class="kpi" style="--accent:var(--c)"><small>Dinero recibido</small><b>${money(recaudadoMes(m))}</b><em>abonos y pagos del mes</em></div>
    <div class="kpi" style="--accent:var(--r)"><small>Pendiente por cancelar</small><b>${money(porCancelar)}</b><em>${pend.length} pedido${pend.length===1?'':'s'}</em></div>
    <div class="kpi" style="--accent:var(--y)"><small>Ganancia del mes</small><b>${money(ganancia)}</b><em>ventas − costos de los pedidos</em></div>
  </div>
  ${alerta}
  <div class="chips">${[['todos','Pedidos del mes'],['cancelados','Cancelados'],['pendientes','Pendientes por cancelar']].map(([k,l])=>`<button class="chip ${filtro===k?'on':''}" data-act="setUi" data-k="ventasFiltro" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="two"><div class="card">${tabla}</div>
  <div class="card" style="align-self:start"><h2>Dinero recibido por medio de pago</h2>${metE.length?metE.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><span class="tr"><i style="width:${Math.max(4,v/maxM*100)}%;background:var(--m)"></i></span><span>${money(v)}</span></div>`).join(''):'<p class="muted">Sin pagos este mes.</p>'}</div></div>`;
}

/* CUENTAS */
function gastoLabel(g){ return g.tipo==='compra' ? 'Compra de insumos' : (g.categoria||'Otros'); }
function vCuentas(){
  const m=ui.cuentasMes||ym(today());
  const sum=(a,f)=>a.reduce((s,x)=>s+num(f(x)),0);
  const gMes=S.gastos.filter(g=>ym(g.fecha)===m).sort((a,b)=>((b.fecha||'')+(b.creado||'')).localeCompare((a.fecha||'')+(a.creado||'')));
  const ing=recaudadoMes(m), egr=sum(gMes,g=>g.total), compras=sum(gMes.filter(g=>g.tipo==='compra'),g=>g.total), util=ing-egr;
  const pend=S.gastos.filter(g=>g.estadoPago==='Pendiente'), porPagar=sum(pend,g=>g.total);
  const cat={}; gMes.forEach(g=>{ const k=gastoLabel(g); cat[k]=(cat[k]||0)+num(g.total); });
  const catE=Object.entries(cat).sort((a,b)=>b[1]-a[1]), maxC=catE.length?catE[0][1]:1;
  const meses=[]; let k=m; for(let n=0;n<6;n++){ meses.unshift(k); k=prevMonth(k); }

async function sumarCompra(items, signo, nota, actualizarCosto){
  for(const it of items){ const ins=S.insumos.find(x=>x.id===it.insumoId); if(!ins||!num(it.cantidad)) continue;
    const upd={stock:num(ins.stock)+signo*num(it.cantidad), movs:[{f:today(),t:signo>0?'Entrada':'Salida',c:num(it.cantidad),n:nota},...(ins.movs||[])].slice(0,30)};
    if(actualizarCosto && num(it.costo)>0) upd.costoBase=num(it.costo);
    await patch('insumos',ins.id,upd); }
}

/* ---- selector de inventario por ítem (camiseta: ref/color/talla · personalizado: tipo/producto) ---- */
const isCam = x => x.categoria==='Camisetas';
const isEmp = x => x.categoria==='Empaque';
const isPers = x => !isCam(x) && !isEmp(x);
const sameTxt = (a,b) => String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
const uniq = a => [...new Set(a.filter(Boolean))];
const STEMS = [['camis','cam'],['buzo','cam'],['mug','Mugs'],['pocill','Mugs'],['termo','Termo'],['llaver','Llaveros'],['mouse','Pad mouse'],['vaso','Vaso ejecutivo'],['gorra','Gorra malla'],['tote','Totebag'],['placa','Placas mascotas'],['lienzo','Lienzos'],['imán','Imanes'],['iman','Imanes'],['rompe','Rompecabezas']];
function prepItem(x){
  const it={invTipo:'', ref:'', color:'', talla:'', pref:'', prod:'', ...x};
  if(it.insumoId==='none'){ it.invTipo='none'; it.insumoId=''; }
  else if(it.insumoId && (!it.invTipo||it.invTipo==='cam'||it.invTipo==='pers')){
    const s=S.insumos.find(y=>y.id===it.insumoId);
    if(s){ it.invTipo=isCam(s)?'cam':'pers'; it.ref=s.referencia||''; it.color=s.color||''; it.talla=s.talla||''; it.pref=s.referencia||''; it.prod=s.producto||''; } }
  else if(!it.invTipo){ const p=S.productos.find(y=>y.id===it.productoId); if(p&&(p.consumos||[]).length) it.invTipo='prod'; }
  return it;
}
function guessTipo(p){
  const t=((p.categoria||'')+' '+(p.nombre||'')).toLowerCase();
  for(const [k,v] of STEMS) if(t.includes(k)) return v==='cam'?{invTipo:'cam'}:{invTipo:'pers', pref:v};
  return null;
}
function persLabel(x){ return [x.producto||x.descripcion||(x.referencia?'':x.nombre)||x.referencia, x.color].filter(Boolean).join(' · '); }
function resolveItem(it){
  const cams=S.insumos.filter(isCam), pers=S.insumos.filter(isPers);
  if(it.invTipo==='cam'){
    const tallas=it.ref==='Kids'?TALLAS_KIDS:TALLAS_ADULTO; if(it.talla && !tallas.includes(it.talla)) it.talla='';
    const cols=uniq(cams.filter(x=>x.referencia===it.ref&&(!it.talla||x.talla===it.talla)).map(x=>x.color));
    if(!it.color && cols.length===1) it.color=cols[0];
    const m=cams.find(x=>x.referencia===it.ref&&x.talla===it.talla&&sameTxt(x.color,it.color));
    it.insumoId=m?m.id:'';
    if(it.ref&&it.talla&&it.color){ const det=`Talla ${it.talla}, ${it.color}, ${it.ref}`; if(!(it.detalle||'').trim()||it.detalle===it._autoDet){ it.detalle=det; it._autoDet=det; } }
    if(m && !(it.nombre||'').trim()) it.nombre=`Camiseta ${m.referencia}`;
  } else if(it.invTipo==='pers'){
    const L=pers.filter(x=>x.referencia===it.pref);
    const prods=uniq(L.map(x=>x.producto));
    if(it.prod && !prods.some(p=>sameTxt(p,it.prod))) it.prod='';
    if(!it.prod && prods.length===1) it.prod=prods[0];
    const cols=uniq(L.filter(x=>sameTxt(x.producto,it.prod)).map(x=>x.color));
    if(it.color && !cols.some(c=>sameTxt(c,it.color))) it.color='';
    if(!it.color && cols.length===1) it.color=cols[0];
    const m=L.find(x=>sameTxt(x.producto,it.prod)&&(sameTxt(x.color,it.color)||(!x.color&&!it.color)));
    it.insumoId=m?m.id:'';
    if(m){ const det=[it.prod,it.color].filter(Boolean).join(', '); if(!(it.detalle||'').trim()||it.detalle===it._autoDet){ it.detalle=det; it._autoDet=det; }
      if(!(it.nombre||'').trim()) it.nombre=`${m.referencia} ${m.producto||''}`.trim(); }
  } else it.insumoId='';
}
function invPickerHTML(it,i){
  const p=S.productos.find(x=>x.id===it.productoId), tieneCons=p&&(p.consumos||[]).length;
  const cams=S.insumos.filter(isCam), pers=S.insumos.filter(isPers);
  const sel=(f,opts,val,ph,dis)=>`<select data-change="inv" data-i="${i}" data-f="${f}" ${dis?'disabled':''}><option value="">${ph}</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${sameTxt(v,val)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const st=L=>{ const n=L.reduce((a,x)=>a+num(x.stock),0); return L.length?` · ${n} disp.`:' · sin registrar'; };
  const modos=[['cam','Camiseta'],['pers','Producto personalizado'],...(tieneCons?[['prod','Según los insumos del producto']]:[]),['none','No descontar del inventario']];
  let body='';
  if(it.invTipo==='cam'){
    const tallas=it.ref==='Kids'?TALLAS_KIDS:TALLAS_ADULTO;
    const deRef=cams.filter(x=>x.referencia===it.ref);
    const deTalla=deRef.filter(x=>x.talla===it.talla);
    const cols=uniq(deTalla.map(x=>x.color)).sort((a,b)=>a.localeCompare(b));
    body=`<div class="g3">
      <label class="mini">Referencia${sel('ref',REFERENCIAS.map(r=>[r,r+st(cams.filter(x=>x.referencia===r))]),it.ref,'Elegir…')}</label>
      <label class="mini">Talla${sel('talla',tallas.map(t=>[t,t+st(deRef.filter(x=>x.talla===t))]),it.talla,it.ref?'Elegir…':'Primero ref.',!it.ref)}</label>
      <label class="mini">Color${sel('color',cols.map(c=>[c,c+st(deTalla.filter(x=>sameTxt(x.color,c)))]),it.color,!it.talla?'Primero talla':cols.length?'Elegir…':'Sin colores registrados',!it.talla||!cols.length)}</label></div>`;
  } else if(it.invTipo==='pers'){
    const deRef=pers.filter(x=>x.referencia===it.pref);
    const prods=uniq(deRef.map(x=>x.producto)).sort((a,b)=>a.localeCompare(b));
    const deProd=deRef.filter(x=>sameTxt(x.producto,it.prod));
    const cols=uniq(deProd.map(x=>x.color)).sort((a,b)=>a.localeCompare(b));
    body=`<div class="g3">
      <label class="mini">Referencia${sel('pref',REF_PERS.map(r=>[r,r+st(pers.filter(x=>x.referencia===r))]),it.pref,'Elegir…')}</label>
      <label class="mini">Nombre del producto${sel('prod',prods.map(n=>[n,n+st(deRef.filter(x=>sameTxt(x.producto,n)))]),it.prod,!it.pref?'Primero ref.':prods.length?'Elegir…':'Sin productos registrados',!it.pref||!prods.length)}</label>
      <label class="mini">Color${sel('color',cols.map(c=>[c,c+st(deProd.filter(x=>sameTxt(x.color,c)))]),it.color,!it.prod?'Primero producto':cols.length?'Elegir…':'—',!it.prod||!cols.length)}</label></div>`;
  }
  return `<div class="inv-pick"><label class="mini">Sale del inventario${sel('modo',modos,it.invTipo,'— Elegir —')}</label>${body}<span class="hint">${insHint(it)}</span></div>`;
}
function insHint(it){
  const falta=(txt,cat,extra)=>`<span class="late">${txt}</span> <button type="button" class="btn ghost sm" style="padding:2px 10px;font-size:12px" data-act="insumoDesdePedido" data-cat="${cat}" data-extra="${esc(JSON.stringify(extra))}">+ Agregar al inventario</button>`;
  if(it.invTipo==='none') return 'Este ítem no descuenta inventario.';
  if(it.invTipo==='cam' && !it.insumoId){
    if(!it.ref||!it.talla) return '<span class="soon">Elige referencia, talla y color</span>';
    if(!S.insumos.some(x=>isCam(x)&&x.referencia===it.ref&&x.talla===it.talla)) return falta(`No hay camisetas ${it.ref} talla ${it.talla} en el inventario.`,'Camisetas',{referencia:it.ref,talla:it.talla});
    return '<span class="soon">Elige el color</span>';
  }
  if(it.invTipo==='pers' && !it.insumoId){
    if(!it.pref) return '<span class="soon">Elige referencia, nombre del producto y color</span>';
    if(!S.insumos.some(x=>isPers(x)&&x.referencia===it.pref)) return falta(`No hay ${it.pref} en el inventario.`,'Productos personalizados',{referencia:it.pref});
    return '<span class="soon">'+(it.prod?'Elige el color':'Elige el nombre del producto')+'</span>';
  }
  const d=calcConsumo([{...it,cantidad:num(it.cantidad)||1}]); const ids=Object.keys(d);
  if(!ids.length) return it.invTipo?'':'<span class="soon">Elige qué sale del inventario para descontarlo</span>';
  return 'Descuenta: '+ids.map(id=>{ const x=S.insumos.find(y=>y.id===id); if(!x) return ''; const ok=num(x.stock)>=d[id]; return `${d[id]}× ${esc(x.nombre)} <span class="${ok?'':'late'}">(${num(x.stock)} disp.)</span>`; }).join(', ');
}
function resolveEmp(it){
  if(!it.empaque||it.empaque==='Sin empaque'){ it.empaqueId=''; it.costoEmpaque=0; return; }
  const L=S.insumos.filter(x=>isEmp(x)&&x.referencia===it.empaque);
  if(!L.some(x=>x.id===it.empaqueId)) it.empaqueId=L.length===1?L[0].id:'';
  const e=L.find(x=>x.id===it.empaqueId); it.costoEmpaque=e?costoBase(e):0;
}
function empPickHTML(it,i){
  if(!it.empaque||it.empaque==='Sin empaque') return '<label class="mini">Empaque<select disabled><option>—</option></select></label>';
  const L=S.insumos.filter(x=>isEmp(x)&&x.referencia===it.empaque).sort((a,b)=>(a.producto||'').localeCompare(b.producto||''));
  if(!L.length) return `<div class="mini" style="align-self:end"><span class="hint late">No hay empaque ${esc(it.empaque.toLowerCase())} en el inventario.</span> <button type="button" class="btn ghost sm" style="padding:2px 10px;font-size:12px" data-act="insumoDesdePedido" data-cat="Empaque" data-extra="${esc(JSON.stringify({referencia:it.empaque}))}">+ Agregar empaque</button></div>`;
  return `<label class="mini">Empaque (${esc(it.empaque.toLowerCase())})<select data-change="itemEmpId" data-i="${i}"><option value="">Elegir…</option>${L.map(x=>`<option value="${x.id}" ${x.id===it.empaqueId?'selected':''}>${esc(x.producto||x.nombre)}${x.color?' '+esc(x.color):''} · ${money(costoBase(x))} · ${num(x.stock)} disp.</option>`).join('')}</select></label>`;

function costHint(it){

/* resize de imagen a dataURL liviano */
function resizeImage(file, max=520){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
    const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.78)); }; img.src=r.result; }; r.readAsDataURL(file); });
}

const C = {
  estado: el=>{ const p=S.pedidos.find(x=>x.id===el.dataset.id); if(!p) return; const e=el.value;

    if(f==='modo'){ it.invTipo=v; it.insumoId=''; }

    if(f==='talla'||f==='ref'){ const ok=S.insumos.some(x=>isCam(x)&&x.referencia===it.ref&&x.talla===it.talla&&sameTxt(x.color,it.color)); if(!ok) it.color=''; }

const F = {
  pedido: async f=>{

    if(!legacy) data.consumo = data.estado==='Anulado' ? {} : calcConsumo(items);
    const id=draft.id||uid(); closeModal();
    await guard(async()=>{ await put('pedidos',id,data); if(!legacy) await aplicarDelta(data.consumo, old?old.consumo:{}, `Pedido #${data.num}`); },
      old?'Pedido actualizado':`Pedido #${data.num} creado · inventario descontado`);
  },
  venta: async f=>{
    const items=draft.items.filter(it=>(it.nombre||'').trim()||it.productoId||it.insumoId).map(it=>({productoId:it.productoId||'',insumoId:it.insumoId||'',invTipo:it.invTipo||'',costoPers:num(it.costoPers),empaque:it.empaque||'Sin empaque',empaqueId:(it.empaque&&it.empaque!=='Sin empaque')?(it.empaqueId||''):'',gastoInd:num(it.gastoInd),costoEmpaque:num(it.costoEmpaque),costoProd:(it.costoProd!=null&&it.costoProd!=='')?num(it.costoProd):(()=>{const x=S.insumos.find(y=>y.id===it.insumoId);return x?costoBase(x):0;})(),nombre:(it.nombre||'').trim()||'Producto',detalle:(it.detalle||'').trim(),cantidad:Math.max(1,num(it.cantidad)),precio:num(it.precio)}));
    if(!items.length){ toast('Agrega al menos un producto'); return; }

    await guard(async()=>{ await put('ventas',id,data); if(descontar) await moverInventario(items,-1,'Venta'); }, old?'Venta actualizada':'Venta registrada ✓');
  },
  pago: async f=>{

    await guard(()=>patch('pedidos',p.id,upd), (entregar?`Pedido #${p.num} entregado · `:'Abono registrado · ')+(falta>0?`faltan ${money(falta)}`:'cancelado en su totalidad ✓'));
  },
  insumo: async f=>{
    const fd=new FormData(f), old=draft.id?S.insumos.find(x=>x.id===draft.id):null;

    const data={...(old?clean(old):{}), categoria:cat, referencia:fd.get('referencia'), color:fd.get('color').trim(), unidad:fd.get('unidad'), stock:num(fd.get('stock')), minimo:num(fd.get('minimo')),

{ const l=document.createElement('link'); l.rel='icon'; l.href=LOGO; document.head.appendChild(l); }

(async()=>{
  const timer=setTimeout(()=>{ if(mode!=='local') setBanner('Todavía no se pudo conectar con la base de datos. Revisa tu conexión; los datos pueden estar desactualizados.'); },10000);
  try{ db = (window.claude && typeof window.claude.use==='function') ? await window.claude.use('db') : null; }catch(e){ db=null; }
  if(!db){ clearTimeout(timer); lsLoad(); mode='local'; setBanner(''); render(); return; }
  mode='db'; render();
  const pend=new Set(COLS);
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const local={}; S[c].forEach(x=>{ if(x._pend) local[x.id]=x; });
      S[c]=snap.docs.map(d=>{ const o=normDoc(c,{...d.data(), id:d.id}); const l=local[d.id]; return l?Object.assign(l,{...o,stock:l.stock}):o; });
      if(!snap.metadata.fromCache){ pend.delete(c); if(!pend.size){ clearTimeout(timer); setBanner(''); } }
      render();
    }, err=>{ clearTimeout(timer); setBanner(err.code==='revoked'?'':'No se pudieron cargar algunos datos. Recarga la página más tarde.'); });
  });
  db.doc('config/negocio').onSnapshot(s=>{ if(s.exists) S.config={...S.config,...s.data()}; render(); }, ()=>{});
})();
